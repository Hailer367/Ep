name: Ephil Agent

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to run the agent (minutes)'
        required: true
        default: '340'
        type: choice
        options:
          - '15'
          - '30'
          - '60'
          - '120'
          - '180'
          - '240'
          - '300'
          - '340'
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  EPHIL_TG_TOKEN: ${{ secrets.EPHIL_TG_TOKEN }}
  EPHIL_TG_CHAT: ${{ secrets.EPHIL_TG_CHAT }}
  ADDRESSES_URL: https://github.com/Hailer367/Add/releases/latest/download/addresses_bech32.txt

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout ephil source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build ephil-scan (release)
        run: cargo build --release --bin ephil-scan

      - name: Download addresses from Add release
        run: curl -fL -o addresses_bech32.txt "$ADDRESSES_URL"

      - name: Verify addresses file
        run: |
          echo "addresses: $(wc -l < addresses_bech32.txt)"
          head -2 addresses_bech32.txt

      - name: Launch ephil agent
        run: |
          nohup ./target/release/ephil-scan --agent \
            --targets "$GITHUB_WORKSPACE/addresses_bech32.txt" \
            </dev/null > ephil.log 2>&1 &
          echo $! > agent.pid
          echo "agent started (pid $(cat agent.pid))"

      - name: Confirm worker registration
        run: |
          sleep 8
          grep -a "assigned id" ephil.log || { echo "agent log:"; tail -20 ephil.log; exit 1; }
          grep -a "thread(s)" ephil.log || true

      - name: Run agent for configured duration
        env:
          DURATION_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_minutes || '340' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PID=$(cat agent.pid)
          DURATION=$((DURATION_MINUTES * 60))
          START=$(date +%s)
          RELAUNCHED=0
          echo "agent pid $PID, running for ${DURATION_MINUTES} minutes"
          while kill -0 "$PID" 2>/dev/null; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            REMAINING=$((DURATION - ELAPSED))
            if [ "$REMAINING" -le 600 ] && [ "$RELAUNCHED" -eq 0 ]; then
              echo "10 minutes left, dispatching follow-up run"
              if gh workflow run "$GITHUB_WORKFLOW" --ref "$GITHUB_REF_NAME" -f duration_minutes="$DURATION_MINUTES"; then
                echo "follow-up run dispatched"
              else
                echo "follow-up dispatch failed"
              fi
              RELAUNCHED=1
            fi
            if [ "$ELAPSED" -ge "$DURATION" ]; then
              echo "duration reached, requesting graceful shutdown"
              kill -TERM "$PID"
              for i in $(seq 1 60); do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 2
              done
              if kill -0 "$PID" 2>/dev/null; then
                echo "agent ignored SIGTERM, force killing"
                kill -9 "$PID"
              fi
              echo "agent stopped after $((ELAPSED / 60)) minutes"
              tail -5 ephil.log || true
              exit 0
            fi
            sleep 10
          done
          echo "agent exited on its own before the duration"
          tail -20 ephil.log || true
          exit 1