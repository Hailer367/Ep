name: Ephil Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  EPHIL_TG_TOKEN: ${{ secrets.EPHIL_TG_TOKEN }}
  EPHIL_TG_CHAT: ${{ secrets.EPHIL_TG_CHAT }}
  ADDRESSES_URL: https://github.com/Hailer367/Add/releases/latest/download/addresses_bech32.txt

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout ephil source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build ephil-scan (release)
        run: cargo build --release --bin ephil-scan

      - name: Download addresses from Add release
        run: curl -fL -o addresses_bech32.txt "$ADDRESSES_URL"

      - name: Verify addresses file
        run: |
          echo "addresses: $(wc -l < addresses_bech32.txt)"
          head -2 addresses_bech32.txt

      - name: Launch ephil agent
        run: |
          nohup ./target/release/ephil-scan --agent \
            --targets "$GITHUB_WORKSPACE/addresses_bech32.txt" \
            </dev/null > ephil.log 2>&1 &
          echo $! > agent.pid
          echo "agent started (pid $(cat agent.pid))"

      - name: Confirm worker registration
        run: |
          sleep 8
          grep -a "assigned id" ephil.log || { echo "agent log:"; tail -20 ephil.log; exit 1; }
          grep -a "thread(s)" ephil.log || true

      - name: Scan while job is alive
        run: |
          PID=$(cat agent.pid)
          while kill -0 "$PID" 2>/dev/null; do
            sleep 60
          done
          echo "agent exited (job ending)"